name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: |
          set -euo pipefail
          package="launchdeck-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/launchdeck" "dist/${package}/"
          cp README.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: launchdeck-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/checksums.txt
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${TAG}" \
              --notes "macOS release for Launchdeck ${TAG}."
          fi
          gh release upload "${TAG}" --repo "${REPO}" --clobber dist/*.tar.gz dist/checksums.txt
      - name: Update Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN is not configured; skipping tap update."
            exit 0
          fi

          version="${TAG#v}"
          arm_sha="$(awk '/aarch64-apple-darwin/ { print $1 }' dist/checksums.txt)"
          intel_sha="$(awk '/x86_64-apple-darwin/ { print $1 }' dist/checksums.txt)"

          export GH_TOKEN="${TAP_GITHUB_TOKEN}"
          gh repo clone sderosiaux/homebrew-tap tap
          cd tap
          git remote set-url origin "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/sderosiaux/homebrew-tap.git"
          mkdir -p Formula
          cat > Formula/launchdeck.rb <<EOF
          class Launchdeck < Formula
            desc "Keyboard-first macOS TUI for launchd jobs and Homebrew services"
            homepage "https://github.com/sderosiaux/launchdeck"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "https://github.com/sderosiaux/launchdeck/releases/download/v${version}/launchdeck-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_sha}"
              end

              on_intel do
                url "https://github.com/sderosiaux/launchdeck/releases/download/v${version}/launchdeck-x86_64-apple-darwin.tar.gz"
                sha256 "${intel_sha}"
              end
            end

            def install
              bin.install "launchdeck"
            end

            test do
              assert_match "Launchdeck", shell_output("#{bin}/launchdeck --help")
            end
          end
          EOF

          ruby -pi -e 'gsub(/^ {10}/, "")' Formula/launchdeck.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/launchdeck.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git commit -m "Update launchdeck to ${TAG}"
          git push
