[package]
name = "launchdeck"
version = "0.1.2"
edition = "2024"
description = "Keyboard-first macOS TUI for launchd jobs and Homebrew services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sderosiaux/launchdeck"
homepage = "https://github.com/sderosiaux/launchdeck"
keywords = ["macos", "launchd", "homebrew", "tui", "services"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29.0"
dirs = "6.0.0"
plist = "1.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shell-words = "1.1.1"
thiserror = "2.0.18"
